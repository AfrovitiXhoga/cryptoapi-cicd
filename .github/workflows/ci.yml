name: CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ./CryptoApiCICD.sln

      - name: Build
        run: dotnet build ./CryptoApiCICD.sln --no-restore -c Release

      - name: Test
        run: dotnet test ./CryptoApiCICD.sln --no-build -c Release
